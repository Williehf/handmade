<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Handmade by K</title>
    <link rel="icon" type="image/png" href="logo2.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="testboton1.css">
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <header class="banner">
        <div class="header-inline-container">
            <span class="header-main-title"><span>Free shipping on orders over $30</span></span>
            <span class="header-separator">|</span>
            <span class="header-second-sentence">Order before 15:00 to have your order shipped today!</span>
        </div>
    </header>

    <header class="banner1">
        <h1>Handmade by K</h1>
    </header>

    <nav class="navbar">
        <ul class="nav-list">
            <li><a href="index.html" class="nav-button">🏠 Home</a></li>
            <li><a href="choose.html" class="nav-button">🛍️ Order</a></li>
            <li><a href="contact.html" class="nav-button">📞 Contact</a></li>
            <li><a href="cart.html" class="nav-button">🛒 Cart</a></li>
        </ul>
    </nav>
    
  <main class="cart-container">
    <div class="tabletitle">
        <h4>Your Cart (2026)</h4>
    </div>
    <table id="cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

        <div class="cart-footer">
            <div class="grand-total-text">
                Grand Total: $<span id="grand-total">0.00</span>
            </div>
            <a href="choose.html" style="text-decoration: none; color: #555; margin-bottom: 10px; display: block;">Continue Shopping</a>
            <a href="checkout.html" style="width: 100%; display: flex; justify-content: center; text-decoration: none;">
                <button class="checkout-btn">Proceed to Checkout</button>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Handmade by K | <a href="about.html" class="footer-link">About Us</a></p>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
